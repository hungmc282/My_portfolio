<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Report Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .ck-editor__editable_inline { min-height: 400px; }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-black text-white flex flex-col h-full shadow-lg">
        <div class="h-16 flex items-center justify-center border-b border-gray-800">
            <h1 class="text-2xl font-bold tracking-wider">CYBER<span class="text-gray-400">X</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/dashboard" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                <i class="fas fa-home w-6"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="/add_report" class="flex items-center px-4 py-3 bg-gray-800 text-white rounded-lg transition-colors">
                <i class="fas fa-pen w-6"></i>
                <span class="font-medium">Viết Bài (Add Report)</span>
            </a>
            <a href="/dashboard" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                <i class="fas fa-list w-6"></i>
                <span class="font-medium">Kiểm Soát Bài Viết</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-gray-500 flex items-center justify-center text-white font-bold">
                    {{ session['username'][0]|upper if session['username'] else 'A' }}
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium">{{ session['username'] }}</p>
                    <p class="text-xs text-gray-400">Quản trị viên</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full relative">
        
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 shadow-sm">
            <div class="w-1/3 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i class="fas fa-search text-gray-400"></i>
                </span>
                <input type="text" placeholder="Tìm kiếm bài viết..." class="w-full border border-gray-300 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
            </div>
            
            <div class="flex items-center space-x-6">
                <span class="text-gray-600 font-medium">Hi, {{ session['username'] }}</span>
                <div class="h-8 w-8 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center overflow-hidden">
                    <i class="fas fa-user text-gray-500"></i>
                </div>
                <a href="/logout" class="text-sm font-medium text-white bg-black hover:bg-gray-800 px-4 py-2 rounded-lg transition-colors">
                    Logout <i class="fas fa-sign-out-alt ml-1"></i>
                </a>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Soạn Bài Viết Mới</h2>
                <p class="text-gray-500 text-sm mt-1">Tạo report mới để chia sẻ kiến thức của bạn</p>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
                <form method="POST" action="/add_report">
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">Tiêu đề bài viết <span class="text-red-500">*</span></label>
                        <input type="text" name="title" required placeholder="Nhập tiêu đề..." class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">Danh mục</label>
                        <input type="text" name="category" placeholder="Ví dụ: Web Security, CTF, Linux..." class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors">
                    </div>
                    
                    <div class="mb-8">
                        <label class="block text-gray-700 font-medium mb-2">Nội dung Report</label>
                        <div class="prose max-w-none">
                            <textarea id="editor" name="content"></textarea>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-4 border-t border-gray-100 pt-6">
                        <button type="submit" class="bg-black hover:bg-gray-800 text-white font-medium py-3 px-8 rounded-lg transition-colors flex items-center">
                            <i class="fas fa-save mr-2"></i> Đăng Bài Viết
                        </button>
                        <a href="/dashboard" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 px-8 rounded-lg transition-colors">
                            Hủy bỏ
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        ClassicEditor
            .create(document.querySelector('#editor'))
            .catch(error => {
                console.error(error);
            });
    </script>
</body>
</html>
