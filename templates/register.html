<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-96 border border-gray-200">
        <h2 class="text-2xl font-bold text-center mb-6 text-black">Đăng ký tài khoản</h2>
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
                <input type="text" name="username" required class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-1 focus:ring-black focus:border-black">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                <input type="password" name="password" required class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-1 focus:ring-black focus:border-black">
            </div>
            <button type="submit" class="w-full bg-black text-white font-medium py-2 rounded-lg hover:bg-gray-800 transition-colors">Đăng ký</button>
        </form>
        <div class="mt-4 text-center">
            <a href="/login" class="text-sm text-gray-500 hover:text-black">Đã có tài khoản? Đăng nhập</a>
        </div>
    </div>
</body>
</html>
